<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matlevic</title>
<meta name="description" content="Apps by Matlevic.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FFFFFF; --text: #1C1B1A; --muted: #5E5B57; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --text: #F1F0ED; --muted: #A9A8A5; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 20px; }
  .brand { text-transform: uppercase; font-family: Syncopate, sans-serif; font-weight: 700; letter-spacing: 0.3em; font-size: 15px; margin: 0 0 40px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; }
  a { color: var(--text); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="brand">Matlevic</p>
  <h1>Sleek Sudoku</h1>
  <p>A calm, uncluttered Sudoku game for Android.</p>
  <p><a href="sleek-sudoku/privacy/">Privacy policy</a> · <a href="mailto:nicoleangwenyi43@gmail.com">Contact</a></p>
</main>
</body>
</html>
